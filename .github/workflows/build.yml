name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install mediapipe==0.10.21 flask==3.1.3 pystray==0.19.5 pillow==11.3.0 pytest==8.3.5 ruff==0.11.13
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Hand tracking smoke test
        run: python -m clicky --selftest tests/assets/woman_hands.jpg

  windows-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Fetch hand model
        run: python scripts/fetch_model.py
      - name: Unit tests
        run: pytest -q
      - name: Build exe
        run: pyinstaller --noconfirm clicky.spec
      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Clicky.exe -ArgumentList "--selftest", "tests\assets\woman_hands.jpg" -Wait -PassThru
          Get-Content "$env:APPDATA\Clicky\clicky.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v5
        with:
          name: Clicky-windows
          path: dist/Clicky.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Clicky.exe
